<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Код входа в Kopi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background-color: #121212;
      font-family: "Space Grotesk", "Space Grotesk Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#121212;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#121212;background-image:radial-gradient(ellipse at 30% 0%, #2a2418 0%, #121212 55%);">
    <tr>
      <td align="center" style="padding:48px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;width:100%;">

          <!-- Brand -->
          <tr>
            <td style="padding-bottom:40px;">
              <span style="font-family:'Space Grotesk','Space Grotesk Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#FFFFFF;">Kopi</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#1a1a1a;border-radius:20px;padding:36px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family:'Space Grotesk','Space Grotesk Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;font-weight:400;color:#8E8E93;padding-bottom:12px;">
                    Код входа
                  </td>
                </tr>
                <tr>
                  <td style="font-family:'JetBrains Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:40px;font-weight:500;letter-spacing:0.35em;color:#D4FB79;padding:8px 0 4px 0;line-height:1.2;">
                    {{.OTP}}
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);">
                    <p style="margin:16px 0 0 0;font-family:'Space Grotesk','Space Grotesk Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;color:#A1A1A1;">
                      Введите этот код в приложении, чтобы войти в аккаунт.
                    </p>
                    <p style="margin:10px 0 0 0;font-family:'Space Grotesk','Space Grotesk Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;color:#6B6B6B;">
                      Код действует 10 минут. Если вы не запрашивали вход — просто проигнорируйте письмо.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top:28px;text-align:left;">
              <p style="margin:0;font-family:'Space Grotesk','Space Grotesk Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;color:#5C5C5C;">
                Kopi · личные финансы без шума
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
