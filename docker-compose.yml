services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: kopi-postgres
    restart: unless-stopped
    volumes:
      - kopi_postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopi -d kopi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
  api:
    build: .
    container_name: kopi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADDRESS: ":8080"
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: .
    container_name: kopi-agent
    restart: unless-stopped
    entrypoint: ["/agent"]
    env_file:
      - .env
    environment:
      ADDRESS: ":8081"
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kopi_postgres_data:
