services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: kopi-postgres
    restart: unless-stopped
    volumes:
      - kopi_postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopi -d kopi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    

  api:
    build: .
    container_name: kopi-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kopi_postgres_data:
