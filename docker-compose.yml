services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: kopi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kopi
      POSTGRES_PASSWORD: kopi
      POSTGRES_DB: kopi
    ports:
      - "5432:5432"
    volumes:
      - kopi_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopi -d kopi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kopi_postgres_data:
